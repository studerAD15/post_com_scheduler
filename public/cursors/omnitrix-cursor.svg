<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="omniGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3DDC10" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#3DDC10" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3DDC10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="omniGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55FF22"/>
      <stop offset="100%" stop-color="#28B007"/>
    </linearGradient>
  </defs>

  <!-- Outer Glow -->
  <circle cx="16" cy="16" r="15.5" fill="url(#omniGlow)"/>

  <!-- Metal Ring -->
  <circle cx="16" cy="16" r="13.5" fill="#141414" stroke="#3DDC10" stroke-width="1.5"/>

  <!-- Inner Dark Bezel -->
  <circle cx="16" cy="16" r="11" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Notches -->
  <rect x="14.5" y="1.5" width="3" height="3" rx="0.5" fill="#3DDC10"/>
  <rect x="14.5" y="27.5" width="3" height="3" rx="0.5" fill="#3DDC10"/>
  <rect x="1.5" y="14.5" width="3" height="3" rx="0.5" fill="#3DDC10"/>
  <rect x="27.5" y="14.5" width="3" height="3" rx="0.5" fill="#3DDC10"/>

  <!-- Hourglass Glyphs -->
  <g transform="translate(16, 16)">
    <path d="M -7,-7.5 L 7,-7.5 L 2.5,-1 L -2.5,-1 Z" fill="url(#omniGreenGrad)" stroke="#0A0A0A" stroke-width="0.6"/>
    <path d="M -7,7.5 L 7,7.5 L 2.5,1 L -2.5,1 Z" fill="url(#omniGreenGrad)" stroke="#0A0A0A" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="2.5" fill="#0A0A0A" stroke="#3DDC10" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="1" fill="#3DDC10"/>
  </g>
</svg>
