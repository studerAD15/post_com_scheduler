<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="omniActiveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3DDC10" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Active Energy Flash Glow -->
  <circle cx="16" cy="16" r="15.5" fill="url(#omniActiveGlow)"/>

  <!-- Metal Ring (Orange Hazard Accent) -->
  <circle cx="16" cy="16" r="13.5" fill="#141414" stroke="#FF7A00" stroke-width="2"/>

  <!-- Inner Dark Bezel -->
  <circle cx="16" cy="16" r="10.5" fill="#0A0A0A" stroke="#FF7A00" stroke-width="1"/>

  <!-- Hourglass Glyphs (Rotated 45 degrees for spin effect) -->
  <g transform="translate(16, 16) rotate(45)">
    <path d="M -7.5,-8 L 7.5,-8 L 2.8,-1 L -2.8,-1 Z" fill="#FF7A00" stroke="#050505" stroke-width="0.7"/>
    <path d="M -7.5,8 L 7.5,8 L 2.8,1 L -2.8,1 Z" fill="#FF7A00" stroke="#050505" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="2.8" fill="#050505" stroke="#FF7A00" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.2" fill="#55FF22"/>
  </g>
</svg>
