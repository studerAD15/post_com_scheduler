<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="omniHoverGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#55FF22" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3DDC10" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3DDC10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="omniBrightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#77FF44"/>
      <stop offset="100%" stop-color="#3DDC10"/>
    </linearGradient>
  </defs>

  <!-- Intense Outer Glow -->
  <circle cx="16" cy="16" r="15.5" fill="url(#omniHoverGlow)"/>

  <!-- Metal Ring (Brighter) -->
  <circle cx="16" cy="16" r="13.5" fill="#1C1C1C" stroke="#55FF22" stroke-width="2"/>

  <!-- Inner Dark Bezel -->
  <circle cx="16" cy="16" r="10.5" fill="#050505" stroke="#3DDC10" stroke-width="1"/>

  <!-- Notches (Glowing) -->
  <rect x="14.5" y="1" width="3" height="3.5" rx="0.5" fill="#55FF22"/>
  <rect x="14.5" y="27.5" width="3" height="3.5" rx="0.5" fill="#55FF22"/>
  <rect x="1" y="14.5" width="3.5" height="3" rx="0.5" fill="#55FF22"/>
  <rect x="27.5" y="14.5" width="3.5" height="3" rx="0.5" fill="#55FF22"/>

  <!-- Active Hourglass Glyphs -->
  <g transform="translate(16, 16)">
    <path d="M -7.5,-8 L 7.5,-8 L 2.8,-1 L -2.8,-1 Z" fill="url(#omniBrightGrad)" stroke="#050505" stroke-width="0.7"/>
    <path d="M -7.5,8 L 7.5,8 L 2.8,1 L -2.8,1 Z" fill="url(#omniBrightGrad)" stroke="#050505" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="2.8" fill="#050505" stroke="#55FF22" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.2" fill="#55FF22"/>
  </g>
</svg>
